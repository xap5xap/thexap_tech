<svg xmlns="http://www.w3.org/2000/svg" width="1500" height="500" viewBox="0 0 1500 500" role="img" aria-label="Make the ambitious real.">
  <defs>
    <linearGradient id="background" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#1b1d20"/>
      <stop offset="0.58" stop-color="#24262a"/>
      <stop offset="1" stop-color="#303136"/>
    </linearGradient>
    <linearGradient id="orange" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ffb43c"/>
      <stop offset="1" stop-color="#f59415"/>
    </linearGradient>
    <radialGradient id="glow">
      <stop offset="0" stop-color="#f59415" stop-opacity="0.20"/>
      <stop offset="1" stop-color="#f59415" stop-opacity="0"/>
    </radialGradient>
    <pattern id="grid" width="66" height="66" patternUnits="userSpaceOnUse">
      <path d="M66 0H0V66" fill="none" stroke="#ffffff" stroke-opacity="0.048" stroke-width="1"/>
    </pattern>
    <filter id="shadow" x="-35%" y="-35%" width="170%" height="170%">
      <feGaussianBlur stdDeviation="24"/>
    </filter>
  </defs>

  <rect width="1500" height="500" fill="url(#background)"/>
  <rect width="1500" height="500" fill="url(#grid)"/>
  <circle cx="464" cy="233" r="270" fill="url(#glow)"/>

  <!-- Layered frames shift from an outline to a solid form. -->
  <g transform="rotate(-12 280 250)" fill="none" stroke="#d4d7d5" stroke-width="2">
    <rect x="118" y="107" width="234" height="234" rx="18" stroke-opacity="0.17"/>
    <rect x="181" y="120" width="234" height="234" rx="18" stroke-opacity="0.28"/>
  </g>
  <g transform="rotate(-12 375 235)">
    <rect x="278" y="122" width="232" height="232" rx="18" fill="#101112" opacity="0.54"/>
    <rect x="278" y="122" width="232" height="232" rx="18" fill="none" stroke="#f59415" stroke-opacity="0.70" stroke-width="3"/>
  </g>
  <rect x="401" y="157" width="166" height="166" rx="20" fill="#f59415" opacity="0.20" filter="url(#shadow)"/>
  <g transform="rotate(-12 484 240)">
    <rect x="404" y="160" width="160" height="160" rx="19" fill="url(#orange)"/>
    <path d="M436 250H532" stroke="#202124" stroke-opacity="0.56" stroke-width="3"/>
    <path d="M436 268H506" stroke="#202124" stroke-opacity="0.42" stroke-width="3"/>
  </g>

  <text x="650" y="215" fill="#f7f7f4" font-family="Avenir Next, Avenir, Helvetica Neue, Arial, sans-serif" font-size="78" font-weight="700" letter-spacing="-1.9">Make the</text>
  <text x="646" y="325" fill="#f59415" font-family="Avenir Next, Avenir, Helvetica Neue, Arial, sans-serif" font-size="89" font-weight="700" letter-spacing="-2.4">ambitious<tspan dx="19" fill="#f7f7f4">real.</tspan></text>
</svg>
